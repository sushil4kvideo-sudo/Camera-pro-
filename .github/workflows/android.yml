name: Camera Pro Android APK

on:
  workflow_dispatch:
  # Build a fresh APK on every push to the main branch.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865
            cmake;3.22.1

      - name: Configure API key for CI
        env:
          BUILT_IN_API_KEY: ${{ secrets.BUILT_IN_API_KEY }}
        run: |
          if [ -n "$BUILT_IN_API_KEY" ]; then
            printf 'BUILT_IN_API_KEY=%s\n' "$BUILT_IN_API_KEY" > .env
            echo "Using BUILT_IN_API_KEY from GitHub Actions secret."
          else
            echo "BUILT_IN_API_KEY secret is not configured; using the safe build placeholder."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run preview orientation regression tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build Minified Debug APK (R8 + Resource Shrinking)
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          echo "APK generated successfully:"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="apk-build-${GITHUB_RUN_NUMBER}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its APK asset."
            gh release upload "$TAG" "$APK_PATH" --clobber
          else
            gh release create "$TAG" "$APK_PATH" \
              --title "Camera Pro APK build #${GITHUB_RUN_NUMBER}" \
              --notes "Camera Pro debug APK built from commit ${GITHUB_SHA}." \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

          echo "APK published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
